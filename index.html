<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151a2b"><meta name="description" content="LineRunner actor rehearsal studio"><title>LineRunner — Rehearsal</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"></head><body>
<header class="topbar"><button id="homeBtn" class="brand" aria-label="LineRunner home"><span class="logo">LR›</span><span><strong>LineRunner</strong><small>Actor's rehearsal studio</small></span></button><div class="headerRight"><span id="saveStatus">Saved locally</span></div></header>
<main><section id="home" class="home"><div class="homeHead"><div><h1>My Plays</h1><p>Open a play or practice with a standalone scene.</p></div><div class="homeActions"><button id="createScene" class="button ghost">＋ New scene</button><button id="createFolder" class="button primary">＋ New folder</button></div></div><div id="folders"></div></section>
<section id="scene" hidden><div class="sceneHead"><div class="breadcrumb" id="breadcrumb"></div><div class="sceneTitleRow"><div><h1 id="sceneTitle"></h1><p id="sceneSubtitle"></p></div><button id="sceneMenu" class="iconBtn sceneMenuBtn" aria-label="Scene settings" title="Scene settings">⋯</button></div><div class="castBar"><strong>Cast</strong><div id="cast"></div></div></div>
<section id="master" class="master"><div class="masterTop"><label class="linePicker">Tile <input id="currentLine" type="number" inputmode="numeric" min="1" value="0" aria-label="Current playback tile"> <span id="lineTotal">/ 0</span></label><span class="scrollButtons"><button id="goTop" class="button ghost small">↑ Top</button><button id="goBottom" class="button ghost small">↓ Bottom</button></span></div><div class="masterControls"><button id="prev" class="button ghost" aria-label="Previous line">⏮</button><button id="masterPlay" class="button primary" aria-label="Play scene">▶ Play</button><button id="next" class="button ghost" aria-label="Next line">⏭</button><label class="loop"><input id="loop" type="checkbox"> Loop</label></div></section>
<div class="timelineHead"><h2>Dialogue Timeline</h2><span id="lineCount"></span></div><div id="timeline"></div></section></main>
<div id="modalBackdrop" class="backdrop" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modalHead"><h2 id="modalTitle"></h2><button id="modalClose" class="iconBtn" aria-label="Close">✕</button></div><div id="modalBody"></div></section></div><div id="toast" role="status" aria-live="polite"></div>
<script src="app.js" defer></script></body></html>
